<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>J1 Conflict — 3D Interactive Viewer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; overflow:hidden; font-family:Arial,sans-serif; }
#canvas-container { width:100vw; height:100vh; }

#ui {
  position:fixed; top:0; left:0; right:0;
  display:flex; flex-direction:column; align-items:center;
  pointer-events:none; z-index:10;
}

#title {
  margin-top:10px;
  background:rgba(0,0,0,0.7);
  color:white; font-size:16px; font-weight:bold;
  padding:6px 16px; border-radius:20px;
}

#toggle-btn {
  margin-top:8px;
  padding:10px 24px; border-radius:25px;
  border:none; font-size:15px; font-weight:bold;
  cursor:pointer; pointer-events:all;
  transition:all 0.3s;
}
.btn-problem { background:#e74c3c; color:white; }
.btn-solution { background:#27ae60; color:white; }

#legend {
  position:fixed; bottom:60px; left:12px;
  background:rgba(0,0,0,0.75);
  border-radius:12px; padding:10px 14px;
  color:white; font-size:13px; line-height:1.9;
}
.dot { display:inline-block; width:12px; height:12px;
       border-radius:3px; margin-right:7px; vertical-align:middle; }

#hint {
  position:fixed; bottom:16px; left:0; right:0;
  text-align:center; color:rgba(255,255,255,0.5);
  font-size:12px;
}

#labels { position:fixed; top:0; left:0; pointer-events:none; }
.lbl {
  position:absolute;
  background:rgba(255,255,255,0.92);
  color:#111; font-size:12px; font-weight:bold;
  padding:3px 8px; border-radius:8px;
  transform:translate(-50%,-50%);
  white-space:nowrap;
  border:1px solid #ccc;
}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="ui">
  <div id="title">J1 vs Rail Lip — Conflict Analysis</div>
  <button id="toggle-btn" class="btn-problem" onclick="toggleMode()">
    ⚠ PROBLEM — click to see SOLUTION
  </button>
</div>

<div id="legend">
  <div><span class="dot" style="background:#2d7a45"></span>PCB (green)</div>
  <div><span class="dot" style="background:#e8920f"></span>J1  USB-C (orange)</div>
  <div><span class="dot" style="background:#3a82bd"></span>Rail body (blue)</div>
  <div id="lip-legend"><span class="dot" style="background:#d63031"></span>Rail lip — CONFLICT (red)</div>
  <div><span class="dot" style="background:#7ac4de"></span>Case shell</div>
</div>

<div id="labels"></div>
<div id="hint">🖱 drag to rotate  •  scroll/pinch to zoom  •  right-drag to pan</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── OrbitControls inline ──────────────────────────
// (minimal version for touch+mouse)
(function(){
const _q=THREE;
THREE.OrbitControls=function(cam,dom){
  this.camera=cam; this.domElement=dom;
  this.target=new _q.Vector3();
  let _this=this,rotS={x:0,y:0},panS={x:0,y:0},dollyS=1;
  let _st={NONE:-1,ROTATE:0,DOLLY:1,PAN:2},state=_st.NONE;
  let rStart=new _q.Vector2(),rEnd=new _q.Vector2(),rDelta=new _q.Vector2();
  let pStart=new _q.Vector2(),pEnd=new _q.Vector2(),pDelta=new _q.Vector2();
  let sp=new _q.Spherical(); sp.setFromVector3(cam.position.clone().sub(this.target));
  this.update=function(){
    sp.theta-=rotS.x*0.01; sp.phi-=rotS.y*0.01;
    sp.phi=Math.max(0.05,Math.min(Math.PI-0.05,sp.phi));
    sp.radius*=dollyS;
    sp.radius=Math.max(5,Math.min(300,sp.radius));
    let pan=new _q.Vector3(-panS.x*sp.radius*0.002,panS.y*sp.radius*0.002,0);
    pan.applyQuaternion(cam.quaternion);
    _this.target.add(pan);
    cam.position.setFromSpherical(sp).add(_this.target);
    cam.lookAt(_this.target);
    rotS.x=0;rotS.y=0;dollyS=1;panS.x=0;panS.y=0;
  };
  let touches={};
  dom.addEventListener('mousedown',e=>{
    if(e.button===0){state=_st.ROTATE;rStart.set(e.clientX,e.clientY);}
    else if(e.button===2){state=_st.PAN;pStart.set(e.clientX,e.clientY);}
  });
  dom.addEventListener('mousemove',e=>{
    if(state===_st.ROTATE){rEnd.set(e.clientX,e.clientY);rDelta.subVectors(rEnd,rStart);rotS.x+=rDelta.x;rotS.y+=rDelta.y;rStart.copy(rEnd);}
    else if(state===_st.PAN){pEnd.set(e.clientX,e.clientY);pDelta.subVectors(pEnd,pStart);panS.x+=pDelta.x;panS.y+=pDelta.y;pStart.copy(pEnd);}
  });
  dom.addEventListener('mouseup',()=>state=_st.NONE);
  dom.addEventListener('contextmenu',e=>e.preventDefault());
  dom.addEventListener('wheel',e=>{dollyS=e.deltaY>0?1.05:0.95;});
  dom.addEventListener('touchstart',e=>{
    if(e.touches.length===1){state=_st.ROTATE;rStart.set(e.touches[0].pageX,e.touches[0].pageY);}
    else if(e.touches.length===2){state=_st.DOLLY;touches.d0=Math.hypot(e.touches[0].pageX-e.touches[1].pageX,e.touches[0].pageY-e.touches[1].pageY);}
  },{passive:true});
  dom.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(state===_st.ROTATE&&e.touches.length===1){rEnd.set(e.touches[0].pageX,e.touches[0].pageY);rDelta.subVectors(rEnd,rStart);rotS.x+=rDelta.x*0.7;rotS.y+=rDelta.y*0.7;rStart.copy(rEnd);}
    else if(state===_st.DOLLY&&e.touches.length===2){let d=Math.hypot(e.touches[0].pageX-e.touches[1].pageX,e.touches[0].pageY-e.touches[1].pageY);dollyS=touches.d0/d;touches.d0=d;}
  },{passive:false});
  dom.addEventListener('touchend',()=>state=_st.NONE);
};
})();

// ── Scene setup ──────────────────────────────────
const W=window.innerWidth, H=window.innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(W,H);
renderer.shadowMap.enabled=true;
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.getElementById('canvas-container').appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a1a2e);

const camera=new THREE.PerspectiveCamera(45,W/H,0.1,1000);
camera.position.set(-18, -35, 32);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(20, 48, 10);
controls.update();

// Lights
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const dl=new THREE.DirectionalLight(0xffffff,0.9);
dl.position.set(60,-30,80); scene.add(dl);
const dl2=new THREE.DirectionalLight(0xaaddff,0.4);
dl2.position.set(-10,70,40); scene.add(dl2);

// ── Dimensions (SCAD) ─────────────────────────────
const S={
  W:90,D:55,T:1.8,FT:3,Hf:42,Hr:65,
  PCB_W:60,PCB_D:35,PCB_T:1.6,
  PCB_X0:15,
  RAIL_D:3.5,RAIL_LIP_Y:1.5,RAIL_LEG:4,RAIL_H:5,PCB_CLR:0.3,
  RAIL_Z0:5
};
S.PCB_x=S.PCB_X0;
S.PCB_y=S.D-S.T-S.PCB_T;   // 51.6
S.PCB_z=S.FT;               // 3
S.J1_x_prob=S.PCB_X0+0.975; // 15.975
S.J1_x_sol=S.PCB_X0+1.975;  // 16.975
S.J1_z=S.PCB_z+1.3;
S.J1_w=11.05; S.J1_d=3.6; S.J1_h=3.2;
S.RAIL_body_x=S.PCB_X0-S.RAIL_LEG;        // 11
S.RAIL_lip_ext=S.PCB_T+S.PCB_CLR;         // 1.9mm — actual x-extent of lip
S.RAIL_lip_end=S.PCB_X0+S.RAIL_lip_ext;   // 16.9

// ── Material helpers ───────────────────────────────
function mat(hex,op=1,wire=false){
  return new THREE.MeshPhongMaterial({
    color:new THREE.Color(hex), opacity:op,
    transparent:op<1, wireframe:wire,
    side:THREE.DoubleSide, depthWrite:op>=1
  });
}

function box3(x,y,z, dx,dy,dz, material){
  const g=new THREE.BoxGeometry(dx,dy,dz);
  const m=new THREE.Mesh(g,material);
  m.position.set(x+dx/2, y+dy/2, z+dz/2);
  return m;
}

// ── Slanted case shell (approximate with 2 boxes) ──
function makeCase(){
  const g=new THREE.Group();
  // Left wall
  g.add(box3(0,0,0, S.T,S.D,S.Hr, mat('#7ac4de',0.18)));
  // Right wall
  g.add(box3(S.W-S.T,0,0, S.T,S.D,S.Hr, mat('#7ac4de',0.18)));
  // Back wall
  g.add(box3(0,S.D-S.T,0, S.W,S.T,S.Hr, mat('#7ac4de',0.18)));
  // Front wall (very transparent so you can see inside)
  g.add(box3(0,0,0, S.W,S.T,S.Hf, mat('#7ac4de',0.06)));
  // Floor plate
  g.add(box3(0,0,0, S.W,S.D,S.FT, mat('#9daab5',0.95)));
  // Slanted top (approx)
  const topG=new THREE.BufferGeometry();
  const verts=new Float32Array([
    0,0,S.Hf,  S.W,0,S.Hf,  S.W,S.D,S.Hr,
    0,0,S.Hf,  S.W,S.D,S.Hr, 0,S.D,S.Hr
  ]);
  topG.setAttribute('position',new THREE.BufferAttribute(verts,3));
  topG.computeVertexNormals();
  g.add(new THREE.Mesh(topG,mat('#7ac4de',0.12)));

  // Case wire edges
  const edges=[
    [[0,0,0],[S.W,0,0]],[[0,S.D,0],[S.W,S.D,0]],
    [[0,0,0],[0,S.D,0]],[[S.W,0,0],[S.W,S.D,0]],
    [[0,0,S.Hf],[S.W,0,S.Hf]],[[0,S.D,S.Hr],[S.W,S.D,S.Hr]],
    [[0,0,0],[0,0,S.Hf]],[[S.W,0,0],[S.W,0,S.Hf]],
    [[0,S.D,0],[0,S.D,S.Hr]],[[S.W,S.D,0],[S.W,S.D,S.Hr]],
    [[0,0,S.Hf],[0,S.D,S.Hr]],[[S.W,0,S.Hf],[S.W,S.D,S.Hr]],
  ];
  edges.forEach(([a,b])=>{
    const g2=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a),new THREE.Vector3(...b)]);
    g.add(new THREE.Line(g2,new THREE.LineBasicMaterial({color:0x4499bb,opacity:0.5,transparent:true})));
  });
  return g;
}

// ── Groups for PROBLEM / SOLUTION ──────────────────
let caseGroup, pcbGroup, j1Group_prob, j1Group_sol;
let railGroup, lipGroup_prob, lipGroup_sol, confGroup;
let insertArrow;

function buildScene(){
  // Case (static)
  caseGroup=makeCase();
  scene.add(caseGroup);

  // PCB
  pcbGroup=new THREE.Group();
  pcbGroup.add(box3(S.PCB_x,S.PCB_y,S.PCB_z, S.PCB_W,S.PCB_T,S.PCB_D, mat('#2d7a45',0.92)));
  // green edges
  [[0,0],[S.PCB_W,0],[0,S.PCB_D],[S.PCB_W,S.PCB_D]].forEach(([dx,dz])=>{
    const g2=new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(S.PCB_x+dx,S.PCB_y,S.PCB_z),
      new THREE.Vector3(S.PCB_x+dx,S.PCB_y+S.PCB_T,S.PCB_z+dz>0?S.PCB_z+S.PCB_D:S.PCB_z)
    ]);
    pcbGroup.add(new THREE.Line(g2,new THREE.LineBasicMaterial({color:0x55ffaa,linewidth:2})));
  });
  scene.add(pcbGroup);

  // J1 — PROBLEM position
  j1Group_prob=new THREE.Group();
  j1Group_prob.add(box3(S.J1_x_prob, S.PCB_y-S.J1_d, S.J1_z, S.J1_w,S.J1_d,S.J1_h, mat('#e8920f',0.97)));
  scene.add(j1Group_prob);

  // J1 — SOLUTION position
  j1Group_sol=new THREE.Group();
  j1Group_sol.add(box3(S.J1_x_sol, S.PCB_y-S.J1_d, S.J1_z, S.J1_w,S.J1_d,S.J1_h, mat('#e8920f',0.97)));
  scene.add(j1Group_sol);
  j1Group_sol.visible=false;

  // Rail body (static)
  railGroup=new THREE.Group();
  railGroup.add(box3(S.RAIL_body_x,S.D-S.T-S.RAIL_D,S.RAIL_Z0, S.RAIL_LEG,S.RAIL_D,S.RAIL_H, mat('#3a82bd',0.9)));
  scene.add(railGroup);

  // Rail lip — PROBLEM (red, 1.9mm)
  lipGroup_prob=new THREE.Group();
  lipGroup_prob.add(box3(S.PCB_X0,S.D-S.T-S.RAIL_D,S.RAIL_Z0, S.RAIL_lip_ext,S.RAIL_D,S.RAIL_H, mat('#d63031',0.95)));
  scene.add(lipGroup_prob);

  // Rail lip — SOLUTION (green, 0.8mm)
  lipGroup_sol=new THREE.Group();
  lipGroup_sol.add(box3(S.PCB_X0,S.D-S.T-S.RAIL_D,S.RAIL_Z0, 0.8,S.RAIL_D,S.RAIL_H, mat('#27ae60',0.95)));
  scene.add(lipGroup_sol);
  lipGroup_sol.visible=false;

  // Conflict zone (bright red)
  confGroup=new THREE.Group();
  const confDx=S.RAIL_lip_end-S.J1_x_prob; // 16.9-15.975=0.925
  confGroup.add(box3(S.J1_x_prob,S.D-S.T-S.RAIL_D,S.RAIL_Z0, confDx,S.RAIL_D,S.RAIL_H, mat('#ff0000',1.0)));
  scene.add(confGroup);

  // Insert arrow
  const arrowDir=new THREE.Vector3(0,0,-1);
  const arrowOrig=new THREE.Vector3(S.PCB_X0+S.PCB_W/2, S.PCB_y+S.PCB_T/2, S.PCB_z+S.PCB_D+10);
  insertArrow=new THREE.ArrowHelper(arrowDir,arrowOrig,8,0x27ae60,3,2);
  scene.add(insertArrow);
}

buildScene();

// ── Mode toggle ────────────────────────────────────
let isProblem=true;

function toggleMode(){
  isProblem=!isProblem;
  j1Group_prob.visible=isProblem;
  j1Group_sol.visible=!isProblem;
  lipGroup_prob.visible=isProblem;
  lipGroup_sol.visible=!isProblem;
  confGroup.visible=isProblem;

  const btn=document.getElementById('toggle-btn');
  const leg=document.getElementById('lip-legend');
  if(isProblem){
    btn.className='btn-problem';
    btn.textContent='⚠ PROBLEM — click to see SOLUTION';
    leg.innerHTML='<span class="dot" style="background:#d63031"></span>Rail lip — CONFLICT (red)';
  } else {
    btn.className='btn-solution';
    btn.textContent='✓ SOLUTION — click to see PROBLEM';
    leg.innerHTML='<span class="dot" style="background:#27ae60"></span>Rail lip — CLEAR (green)';
  }
  updateLabels();
}

// ── HTML Labels ────────────────────────────────────
const labelDefs=[
  {id:'lbl-pcb', pos:new THREE.Vector3(S.PCB_x+S.PCB_W/2, S.PCB_y+S.PCB_T/2, S.PCB_z+S.PCB_D*0.6), text:'PCB'},
  {id:'lbl-j1',  pos:new THREE.Vector3(S.J1_x_prob+S.J1_w/2, S.PCB_y-S.J1_d/2, S.J1_z+S.J1_h+1), text:'J1 USB-C'},
  {id:'lbl-rail',pos:new THREE.Vector3(S.RAIL_body_x+S.RAIL_LEG/2, S.D-S.T-S.RAIL_D/2, S.RAIL_Z0+S.RAIL_H+2), text:'Rail body'},
  {id:'lbl-lip', pos:new THREE.Vector3(S.PCB_X0+0.95, S.D-S.T-S.RAIL_D/2, S.RAIL_Z0+S.RAIL_H+2), text:'Rail lip'},
  {id:'lbl-arr', pos:new THREE.Vector3(S.PCB_X0+S.PCB_W/2, S.PCB_y+S.PCB_T/2, S.PCB_z+S.PCB_D+16), text:'↓ PCB inserts'},
];

const labelsDiv=document.getElementById('labels');
labelDefs.forEach(def=>{
  const el=document.createElement('div');
  el.className='lbl'; el.id=def.id; el.textContent=def.text;
  labelsDiv.appendChild(el);
});

function updateLabels(){
  const v=new THREE.Vector3();
  labelDefs.forEach(def=>{
    v.copy(def.pos);
    v.project(camera);
    const x=(v.x*0.5+0.5)*window.innerWidth;
    const y=(-v.y*0.5+0.5)*window.innerHeight;
    const el=document.getElementById(def.id);
    el.style.left=x+'px'; el.style.top=y+'px';
    el.style.display=(v.z<1)?'block':'none';
  });
  // update j1 label pos if solution
  const j1lbl=document.getElementById('lbl-j1');
  const jx=isProblem?S.J1_x_prob:S.J1_x_sol;
  v.set(jx+S.J1_w/2, S.PCB_y-S.J1_d/2, S.J1_z+S.J1_h+1);
  v.project(camera);
  j1lbl.style.left=((v.x*0.5+0.5)*window.innerWidth)+'px';
  j1lbl.style.top=((-v.y*0.5+0.5)*window.innerHeight)+'px';
  // conflict label
  const conflbl=document.getElementById('lbl-lip');
  const lx=isProblem ? S.PCB_X0+0.95 : S.PCB_X0+0.4;
  const ltxt=isProblem ? '⚠ Rail lip 1.9mm' : '✓ Lip 0.8mm';
  conflbl.textContent=ltxt;
  v.set(lx, S.D-S.T-S.RAIL_D/2, S.RAIL_Z0+S.RAIL_H+2);
  v.project(camera);
  conflbl.style.left=((v.x*0.5+0.5)*window.innerWidth)+'px';
  conflbl.style.top=((-v.y*0.5+0.5)*window.innerHeight)+'px';
}

// ── Animate ────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  updateLabels();
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
