<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Multi-Alarm Clock</title>
    <style>
        :root {
            --bg-color: #a8d8f0;
            --time-color: #000000;
            --date-color: #000000;
            --alarm-color: #000000;
            --time-font: 'Digital-7', sans-serif;
            --date-font: 'Arial', sans-serif;
            --alarm-font: 'Arial', sans-serif;
            --flash-color: #FFA500;
        }
        
        @font-face {
            font-family: 'Digital-7';
            src: url('https://cdnjs.cloudflare.com/ajax/libs/webfont/1.6.28/webfontloader.js');
            /* This is a placeholder. In real use, you'd host the font file */
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: var(--bg-color);
            transition: background-color 0.5s;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            height: 90%;
        }
        
        .date-display {
            font-family: var(--date-font);
            font-size: 5vw;
            color: var(--date-color);
            margin-bottom: 20px;
            text-align: center;
        }
        
        .time-display {
            font-family: var(--time-font);
            font-size: 20vw;
            color: var(--time-color);
            text-align: center;
            line-height: 1;
            transition: color 0.3s;
        }
        
        .alarm-display {
            font-family: var(--alarm-font);
            font-size: 4vw;
            color: var(--alarm-color);
            margin-top: 20px;
            text-align: center;
        }
        
        .settings-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .settings-panel {
            position: fixed;
            top: 0;
            right: -500px;
            width: 500px;
            height: 100%;
            background: white;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
            transition: right 0.3s;
            padding: 20px;
            overflow-y: auto;
            z-index: 99;
        }
        
        .settings-panel.open {
            right: 0;
        }
        
        .panel-section {
            margin-bottom: 30px;
        }
        
        .panel-section h2 {
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid #ddd;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
        }
        
        input, select, button {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            padding: 10px;
        }
        
        button:hover {
            background: #45a049;
        }
        
        .tab-navigation {
            display: flex;
            margin-bottom: 15px;
        }
        
        .tab-button {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #f1f1f1;
            cursor: pointer;
        }
        
        .tab-button.active {
            background: #ddd;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .alarm-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .alarm-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .alarm-item-buttons {
            display: flex;
        }
        
        .alarm-item-buttons button {
            width: auto;
            margin-left: 5px;
            padding: 5px 10px;
        }
        
        .color-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .countdown-container {
            display: none;
            text-align: center;
        }
        
        @media (max-width: 768px) {
            .settings-panel {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="date-display" id="dateDisplay">Friday 07-March-2025</div>
        <div class="time-display" id="timeDisplay">10:15:25</div>
        <div class="alarm-display" id="alarmDisplay">Lunch in 01:14:35</div>
    </div>
    
    <div class="countdown-container" id="countdownContainer">
        <div class="time-display" id="countdownDisplay">15:00</div>
    </div>
    
    <div class="settings-icon" id="settingsIcon">
        <svg width="30" height="30" viewBox="0 0 24 24">
            <path fill="currentColor" d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
    </div>
    
    <div class="settings-panel" id="settingsPanel">
        <div class="tab-navigation">
            <div class="tab-button active" data-tab="alarms">Alarms</div>
            <div class="tab-button" data-tab="templates">Templates</div>
            <div class="tab-button" data-tab="appearance">Appearance</div>
            <div class="tab-button" data-tab="general">General</div>
        </div>
        
        <!-- Alarms Tab -->
        <div class="tab-content active" id="alarmsTab">
            <div class="panel-section">
                <h2>Create Alarm</h2>
                <div class="form-group">
                    <label for="alarmTime">Time:</label>
                    <input type="time" id="alarmTime">
                </div>
                <div class="form-group">
                    <label for="alarmName">Name:</label>
                    <input type="text" id="alarmName" placeholder="Alarm Name">
                </div>
                <div class="form-group">
                    <label for="alarmDuration">Duration (seconds):</label>
                    <input type="number" id="alarmDuration" min="1" value="5">
                </div>
                <div class="form-group">
                    <label for="alarmSound">Sound:</label>
                    <select id="alarmSound">
                        <option value="beep">Beep</option>
                        <option value="chime">Chime</option>
                        <option value="bell">Bell</option>
                        <option value="digital">Digital</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="form-group" id="customSoundGroup" style="display: none;">
                    <label for="customSound">Upload Sound:</label>
                    <input type="file" id="customSound" accept="audio/*">
                </div>
                <div class="form-group">
                    <label for="textFlashing">Text Flashing:</label>
                    <select id="textFlashing">
                        <option value="none">None</option>
                        <option value="color">Color</option>
                    </select>
                </div>
                <div class="form-group" id="flashingColorGroup" style="display: none;">
                    <label for="flashingColor">Flashing Color:</label>
                    <input type="color" id="flashingColor" value="#FFA500">
                </div>
                <div class="form-group">
                    <label for="countdownMode">Switch to Countdown:</label>
                    <select id="countdownMode">
                        <option value="no">No</option>
                        <option value="yes">Yes</option>
                    </select>
                </div>
                <div class="form-group" id="countdownDurationGroup" style="display: none;">
                    <label for="countdownDuration">Countdown Duration (minutes):</label>
                    <input type="number" id="countdownDuration" min="1" value="15">
                </div>
                <button id="addAlarmBtn">Add Alarm</button>
            </div>
            
            <div class="panel-section">
                <h2>Alarms</h2>
                <div class="alarm-list" id="alarmList">
                    <!-- Alarm items will be added here dynamically -->
                </div>
            </div>
        </div>
        
        <!-- Templates Tab -->
        <div class="tab-content" id="templatesTab">
            <div class="panel-section">
                <h2>Schedule Templates</h2>
                <div class="form-group">
                    <label for="templateName">Template Name:</label>
                    <input type="text" id="templateName" placeholder="e.g., Monday Schedule">
                </div>
                <button id="saveTemplateBtn">Save Current Alarms as Template</button>
                
                <div class="form-group" style="margin-top: 20px;">
                    <label for="loadTemplate">Load Template:</label>
                    <select id="loadTemplate">
                        <option value="">Select a template...</option>
                    </select>
                </div>
                <button id="loadTemplateBtn">Load Template</button>
                <button id="deleteTemplateBtn">Delete Template</button>
            </div>
        </div>
        
        <!-- Appearance Tab -->
        <div class="tab-content" id="appearanceTab">
            <div class="panel-section">
                <h2>Colors</h2>
                <div class="form-group">
                    <label for="bgColor">Background Color:</label>
                    <input type="color" id="bgColor" value="#a8d8f0">
                </div>
                <div class="form-group">
                    <label for="timeColor">Time Color:</label>
                    <input type="color" id="timeColor" value="#000000">
                </div>
                <div class="form-group">
                    <label for="dateColor">Date Color:</label>
                    <input type="color" id="dateColor" value="#000000">
                </div>
                <div class="form-group">
                    <label for="alarmColor">Alarm Text Color:</label>
                    <input type="color" id="alarmColor" value="#000000">
                </div>
            </div>
            
            <div class="panel-section">
                <h2>Fonts</h2>
                <div class="form-group">
                    <label for="timeFont">Time Font:</label>
                    <select id="timeFont">
                        <option value="'Digital-7', sans-serif">Digital-7</option>
                        <option value="'Arial', sans-serif">Arial</option>
                        <option value="'Times New Roman', serif">Times New Roman</option>
                        <option value="'Courier New', monospace">Courier New</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="dateFont">Date Font:</label>
                    <select id="dateFont">
                        <option value="'Arial', sans-serif">Arial</option>
                        <option value="'Times New Roman', serif">Times New Roman</option>
                        <option value="'Courier New', monospace">Courier New</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="alarmFont">Alarm Text Font:</label>
                    <select id="alarmFont">
                        <option value="'Arial', sans-serif">Arial</option>
                        <option value="'Times New Roman', serif">Times New Roman</option>
                        <option value="'Courier New', monospace">Courier New</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="customFont">Upload Custom Font (for Time):</label>
                    <input type="file" id="customFont" accept=".ttf,.otf,.woff,.woff2">
                </div>
            </div>
            
            <div class="panel-section">
                <h2>Themes</h2>
                <div class="form-group">
                    <label for="themeName">Theme Name:</label>
                    <input type="text" id="themeName" placeholder="My Theme">
                </div>
                <button id="saveThemeBtn">Save Current Theme</button>
                
                <div class="form-group" style="margin-top: 20px;">
                    <label for="loadTheme">Load Theme:</label>
                    <select id="loadTheme">
                        <option value="">Select a theme...</option>
                        <option value="default">Default</option>
                        <option value="dark">Dark Mode</option>
                        <option value="neon">Neon</option>
                    </select>
                </div>
                <button id="loadThemeBtn">Load Theme</button>
                <button id="deleteThemeBtn">Delete Theme</button>
            </div>
        </div>
        
        <!-- General Tab -->
        <div class="tab-content" id="generalTab">
            <div class="panel-section">
                <h2>Time Format</h2>
                <div class="form-group">
                    <label>
                        <input type="radio" name="timeFormat" value="12" checked> 12-hour format
                    </label>
                    <label>
                        <input type="radio" name="timeFormat" value="24"> 24-hour format
                    </label>
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="showSeconds" checked> Show seconds
                    </label>
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="showDate" checked> Show date
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const timeDisplay = document.getElementById('timeDisplay');
        const dateDisplay = document.getElementById('dateDisplay');
        const alarmDisplay = document.getElementById('alarmDisplay');
        const settingsIcon = document.getElementById('settingsIcon');
        const settingsPanel = document.getElementById('settingsPanel');
        const addAlarmBtn = document.getElementById('addAlarmBtn');
        const alarmList = document.getElementById('alarmList');
        const tabButtons = document.querySelectorAll('.tab-button');
        const tabContents = document.querySelectorAll('.tab-content');
        const countdownContainer = document.getElementById('countdownContainer');
        const countdownDisplay = document.getElementById('countdownDisplay');
        
        // Audio elements for alarms
        const alarmSounds = {
            beep: new Audio('https://cdnjs.cloudflare.com/ajax/libs/beepjs/0.0.2/beep.min.js'),
            chime: new Audio('https://cdnjs.cloudflare.com/ajax/libs/beepjs/0.0.2/beep.min.js'),
            bell: new Audio('https://cdnjs.cloudflare.com/ajax/libs/beepjs/0.0.2/beep.min.js'),
            digital: new Audio('https://cdnjs.cloudflare.com/ajax/libs/beepjs/0.0.2/beep.min.js')
        };
        
        // Global variables
        let alarms = [];
        let templates = {};
        let themes = {
            default: {
                bgColor: '#a8d8f0',
                timeColor: '#000000',
                dateColor: '#000000',
                alarmColor: '#000000',
                timeFont: "'Digital-7', sans-serif",
                dateFont: "'Arial', sans-serif",
                alarmFont: "'Arial', sans-serif"
            },
            dark: {
                bgColor: '#121212',
                timeColor: '#ffffff',
                dateColor: '#cccccc',
                alarmColor: '#cccccc',
                timeFont: "'Digital-7', sans-serif",
                dateFont: "'Arial', sans-serif",
                alarmFont: "'Arial', sans-serif"
            },
            neon: {
                bgColor: '#000000',
                timeColor: '#00ff00',
                dateColor: '#00ffff',
                alarmColor: '#ff00ff',
                timeFont: "'Digital-7', sans-serif",
                dateFont: "'Arial', sans-serif",
                alarmFont: "'Arial', sans-serif"
            }
        };
        let customSounds = {};
        let customFonts = {};
        let timeFormat = 12;
        let showSeconds = true;
        let showDate = true;
        let isFlashing = false;
        let flashingInterval;
        let countdownMode = false;
        let countdownEndTime;
        let countdownInterval;
        
        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
        
        function init() {
            // Load saved data from localStorage
            loadFromLocalStorage();
            
            // Set up event listeners
            setupEventListeners();
            
            // Start the clock
            updateClockDisplay();
            setInterval(updateClockDisplay, 1000);
            
            // Check for alarms every second
            setInterval(checkAlarms, 1000);
            
            // Update UI based on loaded data
            updateUI();
        }
        
        function updateClockDisplay() {
            const now = new Date();
            
            if (countdownMode) {
                updateCountdownDisplay();
                return;
            }
            
            // Update time
            let hours = now.getHours();
            let ampm = '';
            
            if (timeFormat == 12) {
                ampm = hours >= 12 ? ' PM' : ' AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // 0 should be 12
            }
            
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            
            if (showSeconds) {
                timeDisplay.textContent = `${hours}:${minutes}:${seconds}${ampm}`;
            } else {
                timeDisplay.textContent = `${hours}:${minutes}${ampm}`;
            }
            
            // Update date if shown
            if (showDate) {
                const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                
                const day = days[now.getDay()];
                const date = now.getDate().toString().padStart(2, '0');
                const month = months[now.getMonth()];
                const year = now.getFullYear();
                
                dateDisplay.textContent = `${day} ${date}-${month}-${year}`;
                dateDisplay.style.display = 'block';
            } else {
                dateDisplay.style.display = 'none';
            }
            
            // Update next alarm display
            updateNextAlarmDisplay();
        }
        
        function updateCountdownDisplay() {
            if (!countdownEndTime) return;
            
            const now = new Date();
            const difference = countdownEndTime - now;
            
            if (difference <= 0) {
                // Countdown finished
                countdownMode = false;
                clearInterval(countdownInterval);
                countdownContainer.style.display = 'none';
                document.querySelector('.container').style.display = 'flex';
                return;
            }
            
            const minutes = Math.floor(difference / 60000);
            const seconds = Math.floor((difference % 60000) / 1000);
            
            countdownDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        function checkAlarms() {
            if (alarms.length === 0) return;
            
            const now = new Date();
            const currentHours = now.getHours();
            const currentMinutes = now.getMinutes();
            const currentSeconds = now.getSeconds();
            
            alarms.forEach(alarm => {
                const [alarmHours, alarmMinutes] = alarm.time.split(':').map(Number);
                
                if (currentHours === alarmHours && currentMinutes === alarmMinutes && currentSeconds === 0) {
                    triggerAlarm(alarm);
                }
            });
        }
        
        function triggerAlarm(alarm) {
            console.log(`Alarm triggered: ${alarm.name}`);
            
            // Play sound
            playAlarmSound(alarm.sound, alarm.duration);
            
            // Flash text if configured
            if (alarm.textFlashing === 'color') {
                startFlashing(alarm.flashingColor);
                setTimeout(() => stopFlashing(), alarm.duration * 1000);
            }
            
            // Switch to countdown mode if configured
            if (alarm.countdownMode === 'yes') {
                startCountdown(alarm.countdownDuration);
            }
        }
        
        function playAlarmSound(soundName, duration) {
            let sound;
            
            if (soundName === 'custom' && customSounds[soundName]) {
                sound = customSounds[soundName];
            } else {
                sound = alarmSounds[soundName] || alarmSounds.beep;
            }
            
            sound.play();
            
            setTimeout(() => {
                sound.pause();
                sound.currentTime = 0;
            }, duration * 1000);
        }
        
        function startFlashing(color) {
            isFlashing = true;
            const originalColor = getComputedStyle(document.documentElement).getPropertyValue('--time-color');
            
            flashingInterval = setInterval(() => {
                if (timeDisplay.style.color === color) {
                    timeDisplay.style.color = originalColor;
                } else {
                    timeDisplay.style.color = color;
                }
            }, 500);
        }
        
        function stopFlashing() {
            isFlashing = false;
            clearInterval(flashingInterval);
            timeDisplay.style.color = getComputedStyle(document.documentElement).getPropertyValue('--time-color');
        }
        
        function startCountdown(minutes) {
            countdownMode = true;
            document.querySelector('.container').style.display = 'none';
            countdownContainer.style.display = 'flex';
            
            const now = new Date();
            countdownEndTime = new Date(now.getTime() + minutes * 60000);
            
            updateCountdownDisplay();
            countdownInterval = setInterval(updateCountdownDisplay, 1000);
        }
        
        function updateNextAlarmDisplay() {
            if (alarms.length === 0) {
                alarmDisplay.textContent = 'No alarms set';
                return;
            }
            
            const now = new Date();
            const currentHours = now.getHours();
            const currentMinutes = now.getMinutes();
            
            // Find the next alarm
            let nextAlarm = null;
            let shortestDiff = Infinity;
            
            alarms.forEach(alarm => {
                const [alarmHours, alarmMinutes] = alarm.time.split(':').map(Number);
                
                let diff = (alarmHours * 60 + alarmMinutes) - (currentHours * 60 + currentMinutes);
                
                if (diff < 0) {
                    diff += 24 * 60; // Add a day if it's for tomorrow
                }
                
                if (diff < shortestDiff) {
                    shortestDiff = diff;
                    nextAlarm = alarm;
                }
            });
            
            if (nextAlarm) {
                const hoursUntil = Math.floor(shortestDiff / 60);
                const minutesUntil = shortestDiff % 60;
                
                alarmDisplay.textContent = `${nextAlarm.name} in ${hoursUntil.toString().padStart(2, '0')}:${minutesUntil.toString().padStart(2, '0')}:00`;
            } else {
                alarmDisplay.textContent = 'No upcoming alarms';
            }
        }
        
        function setupEventListeners() {
            // Settings panel toggle
            settingsIcon.addEventListener('click', () => {
                settingsPanel.classList.toggle('open');
            });
            
            // Tab navigation
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));
                    
                    button.classList.add('active');
                    document.getElementById(`${button.dataset.tab}Tab`).classList.add('active');
                });
            });
            
            // Add alarm
            addAlarmBtn.addEventListener('click', addAlarm);
            
            // Dynamic field visibility
            document.getElementById('alarmSound').addEventListener('change', function() {
                document.getElementById('customSoundGroup').style.display = this.value === 'custom' ? 'block' : 'none';
            });
            
            document.getElementById('textFlashing').addEventListener('change', function() {
                document.getElementById('flashingColorGroup').style.display = this.value === 'color' ? 'block' : 'none';
            });
            
            document.getElementById('countdownMode').addEventListener('change', function() {
                document.getElementById('countdownDurationGroup').style.display = this.value === 'yes' ? 'block' : 'none';
            });
            
            // Theme settings
            document.getElementById('bgColor').addEventListener('input', function() {
                document.documentElement.style.setProperty('--bg-color', this.value);
            });
            
            document.getElementById('timeColor').addEventListener('input', function() {
                document.documentElement.style.setProperty('--time-color', this.value);
            });
            
            document.getElementById('dateColor').addEventListener('input', function() {
                document.documentElement.style.setProperty('--date-color', this.value);
            });
            
            document.getElementById('alarmColor').addEventListener('input', function() {
                document.documentElement.style.setProperty('--alarm-color', this.value);
            });
            
            document.getElementById('timeFont').addEventListener('change', function() {
                document.documentElement.style.setProperty('--time-font', this.value);
            });
            
            document.getElementById('dateFont').addEventListener('change', function() {
                document.documentElement.style.setProperty('--date-font', this.value);
            });
            
            document.getElementById('alarmFont').addEventListener('change', function() {
                document.documentElement.style.setProperty('--alarm-font', this.value);
            });
            
            // Custom font upload
            document.getElementById('customFont').addEventListener('change', handleCustomFontUpload);
            
            // General settings
            document.querySelectorAll('input[name="timeFormat"]').forEach(input => {
                input.addEventListener('change', function() {
                    timeFormat = parseInt(this.value);
                });
            });
            
            document.getElementById('showSeconds').addEventListener('change', function() {
                showSeconds = this.checked;
            });
            
            document.getElementById('showDate').addEventListener('change', function() {
                showDate = this.checked;
                dateDisplay.style.display = showDate ? 'block' : 'none';
            });
            
            // Template management
            document.getElementById('saveTemplateBtn').addEventListener('click', saveTemplate);
            document.getElementById('loadTemplateBtn').addEventListener('click', loadTemplate);
            document.getElementById('deleteTemplateBtn').addEventListener('click', deleteTemplate);
            
            // Theme management
            document.getElementById('saveThemeBtn').addEventListener('click', saveTheme);
            document.getElementById('loadThemeBtn').addEventListener('click', loadTheme);
            document.getElementById('deleteThemeBtn').addEventListener('click', deleteTheme);
        }
        
        function addAlarm() {
            const time = document.getElementById('alarmTime').value;
            if (!time) {
                alert('Please set a time for the alarm');
                return;
            }
            
            const name = document.getElementById('alarmName').value || 'Alarm';
            const duration = parseInt(document.getElementById('alarmDuration').value) || 5;
            const sound = document.getElementById('alarmSound').value;
            const textFlashing = document.getElementById('textFlashing').value;
            const flashingColor = document.getElementById('flashingColor').value;
            const countdownMode = document.getElementById('countdownMode').value;
            const countdownDuration = parseInt(document.getElementById('countdownDuration').value) || 15;
            
            const alarm = {
                id: Date.now(),
                time,
                name,
                duration,
                sound,
                textFlashing,
                flashingColor,
                countdownMode,
                countdownDuration
            };
            
            alarms.push(alarm);
            alarms.sort((a, b) => {
                const timeA = a.time.split(':').map(Number);
                const timeB = b.time.split(':').map(Number);
                
                if (timeA[0] !== timeB[0]) {
                    return timeA[0] - timeB[0];
                }
                return timeA[1] - timeB[1];
            });
            
            saveToLocalStorage();
            updateAlarmList();
            updateNextAlarmDisplay();
        }
        
        function updateAlarmList() {
            alarmList.innerHTML = '';
            
            alarms.forEach(alarm => {
                const alarmItem = document.createElement('div');
                alarmItem.className = 'alarm-item';
                
                const alarmInfo = document.createElement('div');
                alarmInfo.textContent = `${formatTime(alarm.time)} - ${alarm.name}`;
                
                const alarmButtons = document.createElement('div');
                alarmButtons.className = 'alarm-item-buttons';
                
                const editBtn = document.createElement('button');
                editBtn.textContent = 'Edit';
                editBtn.addEventListener('click', () => editAlarm(alarm.id));
                
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.addEventListener('click', () => deleteAlarm(alarm.id));
                
                alarmButtons.appendChild(editBtn);
                alarmButtons.appendChild(deleteBtn);
                
                alarmItem.appendChild(alarmInfo);
                alarmItem.appendChild(alarmButtons);
                
                alarmList.appendChild(alarmItem);
            });
        }
        
        function formatTime(timeString) {
            if (timeFormat === 12) {
                const [hours, minutes] = timeString.split(':').map(Number);
                const h = hours % 12 || 12;
                const ampm = hours >= 12 ? 'PM' : 'AM';
                return `${h}:${minutes.toString().padStart(2, '0')} ${ampm}`;
            } else {
                return timeString;
            }
        }
        
        function editAlarm(id) {
            const alarm = alarms.find(a => a.id === id);
            if (!alarm) return;
            
            document.getElementById('alarmTime').value = alarm.time;
            document.getElementById('alarmName').value = alarm.name;
            document.getElementById('alarmDuration').value = alarm.duration;
            document.getElementById('alarmSound').value = alarm.sound;
            document.getElementById('textFlashing').value = alarm.textFlashing;
            document.getElementById('flashingColor').value = alarm.flashingColor;
            document.getElementById('countdownMode').value = alarm.countdownMode;
            document.getElementById('countdownDuration').value = alarm.countdownDuration;
            
            // Update dynamic field visibility
            document.getElementById('customSoundGroup').style.display = alarm.sound === 'custom' ? 'block' : 'none';
            document.getElementById('flashingColorGroup').style.display = alarm.textFlashing === 'color' ? 'block' : 'none';
            document.getElementById('countdownDurationGroup').style.display = alarm.countdownMode === 'yes' ? 'block' : 'none';
            
            // Remove the alarm and update UI
            deleteAlarm(id);
        }
        
        function deleteAlarm(id) {
            alarms = alarms.filter(a => a.id !== id);
            saveToLocalStorage();
            updateAlarmList();
            updateNextAlarmDisplay();
        }
        
        function saveTemplate() {
            const name = document.getElementById('templateName').value;
            if (!name) {
                alert('Please enter a name for the template');
                return;
            }
            
            templates[name] = [...alarms];
            saveToLocalStorage();
            updateTemplateList();
        }
        
        function loadTemplate() {
            const select = document.getElementById('loadTemplate');
            const templateName = select.value;
            
            if (!templateName || !templates[templateName]) {
                alert('Please select a valid template');
                return;
            }
            
            alarms = [...templates[templateName]];
            saveToLocalStorage();
            updateAlarmList();
            updateNextAlarmDisplay();
        }
        
        function deleteTemplate() {
            const select = document.getElementById('loadTemplate');
            const templateName = select.value;
            
            if (!templateName || !templates[templateName]) {
                alert('Please select a valid template');
                return;
            }
            
            delete templates[templateName];
            saveToLocalStorage();
            updateTemplateList();
        }
        
        function updateTemplateList() {
            const select = document.getElementById('loadTemplate');
            
            // Save the current selection
            const currentValue = select.value;
            
            // Clear all options except the first one
            while (select.options.length > 1) {
                select.remove(1);
            }
            
            // Add options for each template
            Object.keys(templates).forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
            
            // Restore selection if possible
            if (currentValue && templates[currentValue]) {
                select.value = currentValue;
            }
        }
        
        function saveTheme() {
            const name = document.getElementById('themeName').value;
            if (!name) {
                alert('Please enter a name for the theme');
                return;
            }
            
            themes[name] = {
                bgColor: document.getElementById('bgColor').value,
                timeColor: document.getElementById('timeColor').value,
                dateColor: document.getElementById('dateColor').value,
                alarmColor: document.getElementById('alarmColor').value,
                timeFont: document.getElementById('timeFont').value,
                dateFont: document.getElementById('dateFont').value,
                alarmFont: document.getElementById('alarmFont').value
            };
            
            saveToLocalStorage();
            updateThemeList();
        }
        
        function loadTheme() {
            const select = document.getElementById('loadTheme');
            const themeName = select.value;
            
            if (!themeName || !themes[themeName]) {
                alert('Please select a valid theme');
                return;
            }
            
            const theme = themes[themeName];
            
            document.documentElement.style.setProperty('--bg-color', theme.bgColor);
            document.documentElement.style.setProperty('--time-color', theme.timeColor);
            document.documentElement.style.setProperty('--date-color', theme.dateColor);
            document.documentElement.style.setProperty('--alarm-color', theme.alarmColor);
            document.documentElement.style.setProperty('--time-font', theme.timeFont);
            document.documentElement.style.setProperty('--date-font', theme.dateFont);
            document.documentElement.style.setProperty('--alarm-font', theme.alarmFont);
            
            document.getElementById('bgColor').value = theme.bgColor;
            document.getElementById('timeColor').value = theme.timeColor;
            document.getElementById('dateColor').value = theme.dateColor;
            document.getElementById('alarmColor').value = theme.alarmColor;
            document.getElementById('timeFont').value = theme.timeFont;
            document.getElementById('dateFont').value = theme.dateFont;
            document.getElementById('alarmFont').value = theme.alarmFont;
        }
        
        function deleteTheme() {
            const select = document.getElementById('loadTheme');
            const themeName = select.value;
            
            if (!themeName || !themes[themeName] || themeName === 'default' || themeName === 'dark' || themeName === 'neon') {
                alert('Please select a custom theme to delete');
                return;
            }
            
            delete themes[themeName];
            saveToLocalStorage();
            updateThemeList();
        }
        
        function updateThemeList() {
            const select = document.getElementById('loadTheme');
            
            // Save the current selection
            const currentValue = select.value;
            
            // Clear all options except the first one and defaults
            while (select.options.length > 4) {
                select.remove(4);
            }
            
            // Add options for each custom theme
            Object.keys(themes).forEach(name => {
                if (name === 'default' || name === 'dark' || name === 'neon') return;
                
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
            
            // Restore selection if possible
            if (currentValue && themes[currentValue]) {
                select.value = currentValue;
            }
        }
        
        function handleCustomFontUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const fontName = file.name.split('.')[0];
                const fontFace = new FontFace(fontName, `url(${e.target.result})`);
                
                fontFace.load().then(function(loadedFont) {
                    document.fonts.add(loadedFont);
                    
                    // Add to custom fonts
                    customFonts[fontName] = e.target.result;
                    
                    // Add to font select options
                    const fontValue = `'${fontName}', sans-serif`;
                    const option = document.createElement('option');
                    option.value = fontValue;
                    option.textContent = fontName;
                    document.getElementById('timeFont').appendChild(option);
                    
                    // Select the new font
                    document.getElementById('timeFont').value = fontValue;
                    document.documentElement.style.setProperty('--time-font', fontValue);
                    
                    saveToLocalStorage();
                }).catch(err => {
                    console.error('Error loading font:', err);
                    alert('Failed to load font. Please try a different font file.');
                });
            };
            reader.readAsDataURL(file);
        }
        
        function saveToLocalStorage() {
            try {
                localStorage.setItem('alarms', JSON.stringify(alarms));
                localStorage.setItem('templates', JSON.stringify(templates));
                localStorage.setItem('themes', JSON.stringify(themes));
                localStorage.setItem('customSounds', JSON.stringify(customSounds));
                localStorage.setItem('customFonts', JSON.stringify(customFonts));
                localStorage.setItem('timeFormat', timeFormat);
                localStorage.setItem('showSeconds', showSeconds);
                localStorage.setItem('showDate', showDate);
            } catch (error) {
                console.error('Error saving to localStorage:', error);
            }
        }
        
        function loadFromLocalStorage() {
            try {
                const savedAlarms = localStorage.getItem('alarms');
                const savedTemplates = localStorage.getItem('templates');
                const savedThemes = localStorage.getItem('themes');
                const savedCustomSounds = localStorage.getItem('customSounds');
                const savedCustomFonts = localStorage.getItem('customFonts');
                const savedTimeFormat = localStorage.getItem('timeFormat');
                const savedShowSeconds = localStorage.getItem('showSeconds');
                const savedShowDate = localStorage.getItem('showDate');
                
                if (savedAlarms) alarms = JSON.parse(savedAlarms);
                if (savedTemplates) templates = JSON.parse(savedTemplates);
                if (savedThemes) {
                    const parsedThemes = JSON.parse(savedThemes);
                    themes = { ...themes, ...parsedThemes };
                }
                if (savedCustomSounds) customSounds = JSON.parse(savedCustomSounds);
                if (savedCustomFonts) customFonts = JSON.parse(savedCustomFonts);
                if (savedTimeFormat) timeFormat = parseInt(savedTimeFormat);
                if (savedShowSeconds !== null) showSeconds = savedShowSeconds === 'true';
                if (savedShowDate !== null) showDate = savedShowDate === 'true';
                
                // Load any custom fonts
                Object.entries(customFonts).forEach(([fontName, fontData]) => {
                    const fontFace = new FontFace(fontName, `url(${fontData})`);
                    document.fonts.add(fontFace);
                    
                    // Add to font select options
                    const fontValue = `'${fontName}', sans-serif`;
                    const option = document.createElement('option');
                    option.value = fontValue;
                    option.textContent = fontName;
                    document.getElementById('timeFont').appendChild(option);
                });
            } catch (error) {
                console.error('Error loading from localStorage:', error);
            }
        }
        
        function updateUI() {
            // Update alarm list
            updateAlarmList();
            
            // Update template list
            updateTemplateList();
            
            // Update theme list
            updateThemeList();
            
            // Set time format radio buttons
            document.querySelector(`input[name="timeFormat"][value="${timeFormat}"]`).checked = true;
            
            // Set checkboxes
            document.getElementById('showSeconds').checked = showSeconds;
            document.getElementById('showDate').checked = showDate;
            
            // Load the default theme
            loadTheme();
        }
    </script>
</body>
</html>
