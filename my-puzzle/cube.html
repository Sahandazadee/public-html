<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cube 10×10 — MY PUZZLE</title>
<meta name="description" content="Turn, scramble and solve a fully interactive 3D 10×10 cube. Four difficulty levels, move counter, timer and score.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  body { overflow: hidden; height: 100vh; height: 100dvh; overscroll-behavior: none; }
  .stage { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .stage {
    position: fixed; inset: var(--header-h) 0 0 0;
    background:
      radial-gradient(60% 50% at 50% 55%, rgba(123, 92, 255, 0.16), transparent 70%),
      radial-gradient(40% 40% at 20% 20%, rgba(255, 77, 109, 0.12), transparent 70%),
      radial-gradient(40% 40% at 85% 80%, rgba(0, 194, 168, 0.12), transparent 70%),
      var(--bg);
  }
  #cube-canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .hud {
    position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; pointer-events: none;
  }
  .hud h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); letter-spacing: -0.02em; }
  .hud h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hud p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 320px; }
  .stats { display: flex; gap: 8px; }
  .stats div {
    background: var(--surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; min-width: 76px; text-align: center;
  }
  .stats b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
  .controls {
    position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
    width: max-content; max-width: calc(100% - 32px);
    background: var(--surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line); border-radius: 26px; padding: 8px; box-shadow: var(--shadow);
  }
  .seg { display: flex; background: var(--bg); border-radius: 999px; padding: 3px; }
  .seg button {
    border: 0; background: transparent; padding: 0 12px; height: 36px; border-radius: 999px; cursor: pointer;
    font-weight: 600; font-size: 13px; color: var(--muted);
  }
  .seg button.on { background: var(--surface-solid); color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .controls .btn { height: 42px; }
  .busy .controls .btn, .busy .seg button { opacity: .5; pointer-events: none; }
  @media (max-width: 640px) {
    .controls { gap: 6px; padding: 6px; border-radius: 22px; }
    .seg button { padding: 0 9px; font-size: 12px; }
    .controls .btn { height: 38px; }
    .controls .btn.icon { width: 38px; }
    .hud { flex-direction: column; }
    .hud p { display: none; }
    .stats div { min-width: 64px; padding: 6px 10px; }
    .controls .btn.text-sm span { display: none; }
  }
  @media (max-width: 380px) {
    .seg button { padding: 0 7px; }
    .controls { gap: 4px; }
    .controls .btn.grad { padding: 0 12px; }
  }
  @media (max-height: 480px) and (orientation: landscape) {
    .controls { flex-wrap: nowrap; gap: 5px; padding: 5px; bottom: 6px; }
    .seg button { padding: 0 8px; font-size: 12px; height: 32px; }
    .controls .btn { height: 34px; padding: 0 12px; font-size: 13px; }
    .controls .btn.icon { width: 34px; padding: 0; }
    .controls .btn.text-sm { width: 34px; padding: 0; }
    .controls .btn.text-sm span { display: none; }
    .hud { flex-direction: row; top: 8px; }
    .hud p { display: none; }
    .hud h1 { font-size: 18px; }
    .stats div { padding: 4px 8px; min-width: 56px; }
    .stats b { font-size: 14px; }
  }
</style>
</head>
<body>
<main class="stage">
  <canvas id="cube-canvas" aria-label="Interactive 10 by 10 cube"></canvas>
  <div class="hud">
    <div>
      <h1>Cube <span>10×10</span></h1>
      <p>Drag a sticker to turn its layer. Drag the background or use two fingers to spin the whole cube. Pinch or scroll to zoom.</p>
    </div>
    <div class="stats">
      <div><b id="s-moves">0</b><span>Moves</span></div>
      <div><b id="s-time">00:00</b><span>Time</span></div>
      <div><b id="s-level">—</b><span>Level</span></div>
    </div>
  </div>
  <div class="controls">
    <div class="seg" id="levels">
      <button data-level="easy" class="on">Easy</button>
      <button data-level="medium">Medium</button>
      <button data-level="hard">Hard</button>
      <button data-level="master">Master</button>
    </div>
    <button class="btn grad" id="b-scramble">Scramble</button>
    <button class="btn icon" id="b-mode" title="Rotate mode: one finger spins the whole cube" aria-label="Rotate mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9c-2.4 0-4.6-.9-6.2-2.5"/><path d="M3 12a9 9 0 0 1 9-9c2.4 0 4.6.9 6.2 2.5"/><path d="M18 2v4h-4M6 22v-4h4"/><circle cx="12" cy="12" r="2.5"/></svg>
    </button>
    <button class="btn icon" id="b-undo" title="Undo last move" aria-label="Undo last move">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button class="btn text-sm" id="b-solve" title="Replay the solution (no points)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
      <span>Auto-solve</span>
    </button>
    <button class="btn icon" id="b-reset" title="Reset to solved" aria-label="Reset to solved">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>
</main>
<script type="module" src="assets/js/cube.js"></script>
</body>
</html>
