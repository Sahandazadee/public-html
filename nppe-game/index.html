<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

        let currentQuestionIndex = 0;
        let score = 0;
        let timerInterval;
        const timePerQuestion = 60;

        function applyColors() {
            const q = questions[currentQuestionIndex];
            document.getElementById('question').style.color = q.colors.question;
            const options = document.getElementsByClassName('option');
            for (let opt of options) {
                opt.style.color = q.colors.options;
                opt.style.borderColor = q.colors.options;
            }
            document.getElementById('feedback').style.color = q.colors.feedback;
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('progress').innerText = `سوال ${currentQuestionIndex + 1} از ${questions.length}`;
            document.getElementById('question').innerText = q.question;
            const options = document.getElementsByClassName('option');
            q.options.forEach((opt, index) => {
                options[index].innerText = opt;
                options[index].onclick = () => selectAnswer(index);
                options[index].classList.remove('correct', 'incorrect');
                options[index].disabled = false;
            });
            applyColors();
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('next-button').style.display = 'none';
            startTimer();
        }

        function startTimer() {
            let timeLeft = timePerQuestion;
            const timerBar = document.getElementById('timer-bar');
            const timerWarning = document.getElementById('timer-warning');
            timerBar.style.width = '100%';
            timerBar.style.background = 'green';
            timerWarning.innerText = `زمان باقی‌مانده: ${timeLeft} ثانیه`;
            timerInterval = setInterval(() => {
                timeLeft--;
                const percentage = (timeLeft / timePerQuestion) * 100;
                timerBar.style.width = percentage + '%';
                timerWarning.innerText = `زمان باقی‌مانده: ${timeLeft} ثانیه`;
                if (percentage > 50) {
                    timerBar.style.background = 'green';
                } else if (percentage > 20) {
                    timerBar.style.background = '#ffff00';
                } else {
                    timerBar.style.background = 'red';
                    timerWarning.style.color = 'red';
                }
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    selectAnswer(-1);
                }
            }, 1000);
        }

        function selectAnswer(selectedIndex) {
            clearInterval(timerInterval);
            const q = questions[currentQuestionIndex];
            const feedback = document.getElementById('feedback');
            const options = document.getElementsByClassName('option');
            for (let opt of options) {
                opt.disabled = true;
            }
            if (selectedIndex === q.correct) {
                score += 10;
                feedback.innerHTML = '<span style="color: green">درست است!</span>';
                options[selectedIndex].classList.add('correct');
                playSound('correct');
            } else {
                feedback.innerHTML = '<span style="color: red">غلط است!</span> جواب درست: ' + q.options[q.correct];
                if (selectedIndex >= 0) options[selectedIndex].classList.add('incorrect');
                options[q.correct].classList.add('correct');
                playSound('incorrect');
            }
            feedback.innerHTML += '<br>توضیح: ' + q.explanation_fa + '<br>Explanation: ' + q.explanation_en + '<br>کلمه کلیدی: <span class="key-term">' + q.key_term + '</span><br>نشانه: <em>' + q.mnemonic + '</em>';
            feedback.style.display = 'block';
            document.getElementById('score').innerText = 'امتیاز: ' + score;
            document.getElementById('next-button').style.display = 'block';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('end-screen').style.display = 'block';
            document.getElementById('final-score').innerText = 'امتیاز نهایی: ' + score;
        }

        document.getElementById('start-button').onclick = startGame;
        document.getElementById('next-button').onclick = nextQuestion;
        document.getElementById('restart-button').onclick = () => {
            currentQuestionIndex = 0;
            score = 0;
            document.getElementById('end-screen').style.display = 'none';
            startGame();
        };

        function playSound(type) {
            const audio = new Audio(type + '.mp3');
            audio.play();
        }
    </script>
