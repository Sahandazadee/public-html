<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock with Advanced Alarms</title>
    <style>
        /* Import custom font for clock display */
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap');
        
        /* CSS Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Main body styling */
        body {
            font-family: 'Roboto Mono', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #87CEEB, #4682B4);
            overflow: hidden;
            position: relative;
            transition: background 0.5s ease;
        }
        
        /* Container for all elements */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 95vw;
            max-width: 1400px;
        }
        
        /* Clock display styling */
        .clock {
            font-family: 'Roboto Mono', monospace;
            font-size: 12vw;
            font-weight: bold;
            color: #000;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: color 0.3s;
            padding: 20px;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            width: 90%;
            max-width: 1200px;
            text-align: center;
            line-height: 1;
            position: relative;
            z-index: 50;
        }
        
        /* Date display */
        .date-display {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        /* Upcoming alarms display area */
        .upcoming-alarms {
            width: 100%;
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
            font-size: 1.5rem;
            font-weight: bold;
            min-height: 2rem;
        }
        
        /* Settings panel positioned at bottom right */
        .alarm-settings {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
            max-width: 400px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .settings-visible {
            display: block !important;
        }
        
        /* Form layout for alarm settings */
        .alarm-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        
        /* Settings title */
        .settings-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #2c3e50;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* Toggle button for settings panel */
        .toggle-settings {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #e74c3c;
            color: white;
            border: 3px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 101;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        /* Input and button styling */
        input, button, select {
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            background-color: #fff;
            font-family: inherit;
        }
        
        /* Duration inputs container */
        .duration-inputs {
            display: flex;
            gap: 8px;
        }
        
        .duration-inputs input {
            flex: 1;
            text-align: center;
        }
        
        /* Label styling */
        label {
            font-size: 0.9rem;
            color: #2c3e50;
            margin-bottom: -5px;
        }
        
        /* Time format hint */
        .time-hint {
            font-size: 0.75rem;
            color: #7f8c8d;
            margin-top: -5px;
            font-style: italic;
        }
        
        /* Button styling */
        button {
            cursor: pointer;
            background-color: #2c3e50;
            color: white;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #1a2530;
        }
        
        .btn-secondary {
            background-color: #7f8c8d;
        }
        
        .btn-secondary:hover {
            background-color: #6c7a7a;
        }
        
        /* Close button for settings */
        .close-settings {
            background: none;
            border: none;
            color: #2c3e50;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Alarms list container */
        .alarms-container {
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
        }
        
        /* Individual alarm item */
        .alarm-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            margin-bottom: 8px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            font-size: 0.9rem;
        }
        
        /* Alarm time display */
        .alarm-time {
            font-weight: bold;
        }
        
        /* Alarm label */
        .alarm-label {
            font-size: 0.8rem;
            color: #7f8c8d;
            margin-top: 3px;
            font-style: italic;
        }
        
        /* Alarm day indicators */
        .alarm-days {
            display: flex;
            font-size: 0.75rem;
            margin-top: 4px;
        }
        
        .alarm-day {
            width: 16px;
            height: 16px;
            margin-right: 3px;
            border-radius: 50%;
            background-color: rgba(52, 152, 219, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 0.6rem;
        }
        
        .alarm-day.active {
            background-color: #3498db;
        }
        
        /* Alarm action buttons container */
        .alarm-actions {
            display: flex;
            gap: 5px;
        }
        
        /* Delete and toggle buttons */
        .delete-btn, .toggle-btn, .edit-btn {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            min-width: 48px;
        }
        
        .delete-btn {
            background-color: #e74c3c;
        }
        
        .toggle-btn {
            background-color: #3498db;
        }
        
        .toggle-btn.paused {
            background-color: #f39c12;
        }
        
        .edit-btn {
            background-color: #27ae60;
        }
        
        /* Weekday selection */
        .weekday-selection {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        
        .weekday-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .weekday-btn.selected {
            background-color: #3498db;
            color: white;
        }
        
        /* Form actions */
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .form-actions button {
            flex: 1;
        }
        
        /* Blinking animation for alarm */
        .blinking-clock {
            animation: blink-animation 0.5s infinite;
        }
        
        @keyframes blink-animation {
            0% { color: #ff0000; }
            33% { color: #ffff00; }
            66% { color: #00ff00; }
            100% { color: #ff0000; }
        }
        
        /* Timer container - redesigned */
        .timer-container {
            display: none;
            position: relative;
            width: 90%;
            max-width: 400px;
            margin: 0 auto;
            margin-top: 20px;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 30px;
            z-index: 90;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }
        
        /* Enhanced timer design */
        .timer {
            width: 200px;
            height: 200px;
            position: relative;
            margin: 0 auto 20px;
        }
        
        /* Timer circle design - glass effect */
        .timer-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2),
                        inset 0 0 15px rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        /* Timer progress indicator with gradient color change */
        .timer-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            transition: height 0.5s linear, background 0.5s linear;
            background: #4cd137; /* Start with green */
        }
        
        /* Timer center circle - glass effect */
        .timer-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 70%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2),
                        inset 0 0 10px rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        /* Time remaining text */
        .time-remaining {
            color: white;
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        /* Timer label */
        .timer-label {
            color: white;
            font-size: 1.2rem;
            margin-top: 10px;
            text-align: center;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        
        /* Close timer button */
        .close-timer {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(231, 76, 60, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 1rem;
            cursor: pointer;
            z-index: 91;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
            transition: all 0.3s ease;
            backdrop-filter: blur(3px);
        }
        
        .close-timer:hover {
            transform: scale(1.1);
            background-color: rgba(231, 76, 60, 1);
        }

        /* Color picker container */
        .color-picker-container {
            margin-top: 15px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        /* Color preset buttons */
        .color-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .color-preset {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .color-picker-inputs {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .color-picker-inputs input {
            flex: 1;
        }
        
        /* Responsive design for different screen sizes */
        @media (max-width: 768px) {
            .clock {
                font-size: 18vw;
            }
            
            .alarm-settings {
                width: 95%;
                max-width: none;
                bottom: 10px;
                right: 10px;
            }
            
            .toggle-settings {
                bottom: 10px;
                right: 10px;
            }
            
            .timer {
                width: 150px;
                height: 150px;
            }
            
            .time-remaining {
                font-size: 1.5rem;
            }
            
            .weekday-btn {
                width: 35px;
                height: 35px;
                font-size: 0.8rem;
            }
        }
        
        /* For very large screens */
        @media (min-width: 1600px) {
            .clock {
                font-size: 10vw;
            }
        }
        
        /* For ultra-wide screens */
        @media (min-width: 2200px) {
            .clock {
                font-size: 8vw;
            }
        }
    </style>
</head>
<body>
    <!-- Main container -->
    <div class="container">
        <!-- Date display -->
        <div id="dateDisplay" class="date-display">Monday, January 1, 2024</div>
        
        <!-- Main clock display -->
        <div id="clock" class="clock">00:00:00 AM</div>
        
        <!-- Upcoming alarms display area -->
        <div id="upcomingAlarms" class="upcoming-alarms"></div>
        
        <!-- Timer container with glass effect -->
        <div id="timerContainer" class="timer-container">
            <button id="closeTimer" class="close-timer">×</button>
            
            <div class="timer" id="timer">
                <div class="timer-circle">
                    <div id="timerFill" class="timer-fill"></div>
                </div>
                <div class="timer-center">
                    <div id="timeRemaining" class="time-remaining">00:00</div>
                </div>
            </div>
            
            <div id="timerLabel" class="timer-label">Time Remaining</div>
        </div>
    </div>
    
    <!-- Alarm settings toggle button -->
    <button id="toggleSettings" class="toggle-settings">⚙️</button>
    
    <!-- Alarm settings panel -->
    <div id="alarmSettings" class="alarm-settings" style="display: none;">
        <div class="settings-title">
            <span id="settingsTitle">Add Alarm</span>
            <button id="closeSettings" class="close-settings">×</button>
        </div>
        
        <!-- Alarm form with custom duration inputs -->
        <div class="alarm-form">
            <label for="alarmHour">Hour:</label>
            <div class="duration-inputs">
                <input type="number" id="alarmHour" min="1" max="12" placeholder="Hour (1-12)" required>
                <input type="number" id="alarmMinute" min="0" max="59" placeholder="Minute (0-59)" required>
                <select id="amPmSelect">
                    <option value="AM">AM</option>
                    <option value="PM">PM</option>
                </select>
            </div>
            <div class="time-hint">Format: 12-hour time with AM/PM</div>
            
            <label for="alarmLabel">Alarm Label:</label>
            <input type="text" id="alarmLabel" placeholder="Enter a label for this alarm">
            
            <label>Days (optional for one-time alarms):</label>
            <div class="weekday-selection">
                <div class="weekday-btn" data-day="0">S</div>
                <div class="weekday-btn" data-day="1">M</div>
                <div class="weekday-btn" data-day="2">T</div>
                <div class="weekday-btn" data-day="3">W</div>
                <div class="weekday-btn" data-day="4">T</div>
                <div class="weekday-btn" data-day="5">F</div>
                <div class="weekday-btn" data-day="6">S</div>
            </div>
            
            <label>Timer Duration:</label>
            <div class="duration-inputs">
                <input type="number" id="durationMinutes" min="0" max="60" placeholder="Minutes">
                <input type="number" id="durationSeconds" min="0" max="59" placeholder="Seconds">
            </div>
            
            <div class="form-actions">
                <button id="setAlarm">Add Alarm</button>
                <button id="cancelEdit" class="btn-secondary" style="display: none;">Cancel</button>
            </div>

            <!-- Background color customization -->
            <div class="color-picker-container">
                <label>Background Color:</label>
                <div class="color-presets">
                    <div class="color-preset" style="background: linear-gradient(135deg, #87CEEB, #4682B4);" data-color1="#87CEEB" data-color2="#4682B4"></div>
                    <div class="color-preset" style="background: linear-gradient(135deg, #FFA07A, #FF6347);" data-color1="#FFA07A" data-color2="#FF6347"></div>
                    <div class="color-preset" style="background: linear-gradient(135deg, #98FB98, #3CB371);" data-color1="#98FB98" data-color2="#3CB371"></div>
                    <div class="color-preset" style="background: linear-gradient(135deg, #DDA0DD, #8A2BE2);" data-color1="#DDA0DD" data-color2="#8A2BE2"></div>
                    <div class="color-preset" style="background: linear-gradient(135deg, #FFD700, #FF8C00);" data-color1="#FFD700" data-color2="#FF8C00"></div>
                </div>
                <div class="color-picker-inputs">
                    <input type="color" id="colorPicker1" value="#87CEEB">
                    <input type="color" id="colorPicker2" value="#4682B4">
                    <button id="applyColorBtn" class="btn-secondary">Apply</button>
                </div>
            </div>
        </div>
        
        <!-- Alarms list -->
        <div class="alarms-container" id="alarmsContainer">
            <!-- Alarm items will be added here dynamically -->
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM elements
            const clockElement = document.getElementById('clock');
            const dateDisplayElement = document.getElementById('dateDisplay');
            const alarmHourInput = document.getElementById('alarmHour');
            const alarmMinuteInput = document.getElementById('alarmMinute');
            const amPmSelect = document.getElementById('amPmSelect');
            const alarmLabelInput = document.getElementById('alarmLabel');
            const durationMinutesInput = document.getElementById('durationMinutes');
            const durationSecondsInput = document.getElementById('durationSeconds');
            const setAlarmButton = document.getElementById('setAlarm');
            const cancelEditButton = document.getElementById('cancelEdit');
            const settingsTitleElement = document.getElementById('settingsTitle');
            const alarmsContainer = document.getElementById('alarmsContainer');
            const upcomingAlarmsElement = document.getElementById('upcomingAlarms');
            const toggleSettingsButton = document.getElementById('toggleSettings');
            const alarmSettingsPanel = document.getElementById('alarmSettings');
            const closeSettingsButton = document.getElementById('closeSettings');
            const timerContainer = document.getElementById('timerContainer');
            const closeTimerButton = document.getElementById('closeTimer');
            const timerFill = document.getElementById('timerFill');
            const timeRemainingElement = document.getElementById('timeRemaining');
            const weekdayButtons = document.querySelectorAll('.weekday-btn');
            
            // Color picker elements
            const colorPicker1 = document.getElementById('colorPicker1');
            const colorPicker2 = document.getElementById('colorPicker2');
            const applyColorBtn = document.getElementById('applyColorBtn');
            const colorPresets = document.querySelectorAll('.color-preset');
            
            // Variables
            let alarms = [];
            let blinkingTimeout;
            let clockInterval;
            let timerInterval;
            let upcomingCheckInterval;
            let audioContext = null;
            let selectedDays = [];
            let editingAlarmId = null; // Track which alarm is being edited
            
            // Days of week array for display
            const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const shortDaysOfWeek = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
            
            // Function to update date
            function updateDate() {
                const now = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                dateDisplayElement.textContent = now.toLocaleDateString('en-US', options);
            }
            
            // Function to update clock - continuous operation
            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                const minutes = now.getMinutes().toString().padStart(2, '0');
                const seconds = now.getSeconds().toString().padStart(2, '0');
                
                // Convert to 12-hour format
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // the hour '0' should be '12'
                const formattedHours = hours.toString().padStart(2, '0');
                
                clockElement.textContent = `${formattedHours}:${minutes}:${seconds} ${ampm}`;
                
                // Check if any alarm should trigger
                checkAlarms(now);
                
                // Update date at midnight
                if (hours === 12 && minutes === "00" && seconds === "00" && ampm === 'AM') {
                    updateDate();
                }
            }
            
            // Function to convert 12-hour format to 24-hour format
            function convertTo24Hour(hour, minute, ampm) {
                hour = parseInt(hour);
                minute = parseInt(minute);
                
                if (ampm === 'PM' && hour < 12) {
                    hour += 12;
                } else if (ampm === 'AM' && hour === 12) {
                    hour = 0;
                }
                
                return `${hour.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')}`;
            }
            
            // Function to convert 24-hour format to 12-hour format
            function convertTo12Hour(timeString) {
                if (!timeString) return { hour: '', minute: '', ampm: 'AM' };
                
                const [hours, minutes] = timeString.split(':').map(Number);
                
                let hour = hours % 12;
                hour = hour ? hour : 12; // the hour '0' should be '12'
                const ampm = hours >= 12 ? 'PM' : 'AM';
                
                return {
                    hour: hour.toString(),
                    minute: minutes.toString().padStart(2, '0'),
                    ampm: ampm
                };
            }
            
            // Validate time inputs
            function validateTimeInputs() {
                const hour = parseInt(alarmHourInput.value);
                const minute = parseInt(alarmMinuteInput.value);
                
                if (isNaN(hour) || hour < 1 || hour > 12) {
                    alert('Please enter a valid hour (1-12)');
                    return false;
                }
                
                if (isNaN(minute) || minute < 0 || minute > 59) {
                    alert('Please enter a valid minute (0-59)');
                    return false;
                }
                
                return true;
            }
            
            // Function to create and play beep sound using Web Audio API
            function createBeepSound() {
                try {
                    // Lazy initialize AudioContext on first use (to avoid autoplay policy issues)
                    if (!audioContext) {
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();

                    // Create a higher pitched beep sound (880Hz = one octave above A4)
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(880, audioContext.currentTime);

                    // Set volume and fade out
                    gainNode.gain.setValueAtTime(0.5, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);

                    // Connect nodes
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    // Start and stop the sound
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.5);
                    
                    return oscillator;
                } catch (e) {
                    console.error('Error creating beep sound:', e);
                    return null;
                }
            }
            
            // Fix for localStorage issues in some environments
            try {
                // Create a mock localStorage if needed
                if (typeof localStorage === 'undefined' || localStorage === null) {
                    var memoryStorage = {};
                    window.localStorage = {
                        getItem: function(key) {
                            return memoryStorage[key] || null;
                        },
                        setItem: function(key, value) {
                            memoryStorage[key] = value.toString();
                        },
                        removeItem: function(key) {
                            delete memoryStorage[key];
                        },
                        clear: function() {
                            memoryStorage = {};
                        }
                    };
                    console.log("Created localStorage polyfill");
                }
            } catch (e) {
                console.error("localStorage not available:", e);
            }
            
            // Try loading saved alarms
            try {
                const savedAlarms = localStorage.getItem('alarms');
                if (savedAlarms) {
                    alarms = JSON.parse(savedAlarms);
                    console.log("Loaded saved alarms:", alarms);
                }
                
                // Try to load saved background colors
                const savedColor1 = localStorage.getItem('bgColor1');
                const savedColor2 = localStorage.getItem('bgColor2');
                
                if (savedColor1 && savedColor2) {
                    document.body.style.background = `linear-gradient(135deg, ${savedColor1}, ${savedColor2})`;
                    colorPicker1.value = savedColor1;
                    colorPicker2.value = savedColor2;
                }
            } catch (e) {
                console.warn("Could not load saved data:", e);
            }
            
            // Make settings button visible initially
            toggleSettingsButton.style.display = 'flex';
            alarmSettingsPanel.style.display = 'none';
            
            // Toggle settings panel with improved functionality
            toggleSettingsButton.addEventListener('click', function(e) {
                e.preventDefault();
                console.log('Settings button clicked');
                
                // Reset form to add mode
                resetAlarmForm();
                
                // Force display settings to be correct
                alarmSettingsPanel.style.display = 'block';
                toggleSettingsButton.style.display = 'none';
                
                // Add a class to make it more visible
                alarmSettingsPanel.classList.add('settings-visible');
            });
            
            closeSettingsButton.addEventListener('click', function(e) {
                e.preventDefault();
                console.log('Close settings button clicked');
                
                // Reset form before closing
                resetAlarmForm();
                
                // Force display settings to be correct
                alarmSettingsPanel.style.display = 'none';
                toggleSettingsButton.style.display = 'flex';
                
                // Remove the visible class
                alarmSettingsPanel.classList.remove('settings-visible');
            });
            
            // Cancel edit button
            cancelEditButton.addEventListener('click', function(e) {
                e.preventDefault();
                resetAlarmForm();
            });
            
            // Background color customization events
            colorPresets.forEach(preset => {
                preset.addEventListener('click', function() {
                    const color1 = this.getAttribute('data-color1');
                    const color2 = this.getAttribute('data-color2');
                    
                    // Set input values
                    colorPicker1.value = color1;
                    colorPicker2.value = color2;
                    
                    // Apply colors immediately
                    applyBackgroundColors(color1, color2);
                });
            });
            
            applyColorBtn.addEventListener('click', function() {
                applyBackgroundColors(colorPicker1.value, colorPicker2.value);
            });
            
            function applyBackgroundColors(color1, color2) {
                // Apply gradient
                document.body.style.background = `linear-gradient(135deg, ${color1}, ${color2})`;
                
                // Save colors to localStorage
                localStorage.setItem('bgColor1', color1);
                localStorage.setItem('bgColor2', color2);
            }
            
            // Weekday selection buttons
            weekdayButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const day = parseInt(this.getAttribute('data-day'));
                    
                    if (this.classList.contains('selected')) {
                        // Remove day if already selected
                        this.classList.remove('selected');
                        selectedDays = selectedDays.filter(d => d !== day);
                    } else {
                        // Add day if not selected
                        this.classList.add('selected');
                        selectedDays.push(day);
                    }
                    
                    console.log('Selected days:', selectedDays);
                });
            });
            
            // Function to reset the alarm form to add mode
            function resetAlarmForm() {
                // Reset form fields
                alarmHourInput.value = '';
                alarmMinuteInput.value = '';
                amPmSelect.value = 'AM';
                alarmLabelInput.value = '';
                durationMinutesInput.value = '';
                durationSecondsInput.value = '';
                
                // Reset selected days
                selectedDays = [];
                weekdayButtons.forEach(btn => btn.classList.remove('selected'));
                
                // Reset form to add mode
                setAlarmButton.textContent = 'Add Alarm';
                settingsTitleElement.textContent = 'Add Alarm';
                cancelEditButton.style.display = 'none';
                editingAlarmId = null;
            }
            
            // Function to populate form for editing
            function populateFormForEditing(alarm) {
                // Set form to edit mode
                editingAlarmId = alarm.id;
                settingsTitleElement.textContent = 'Edit Alarm';
                setAlarmButton.textContent = 'Update Alarm';
                cancelEditButton.style.display = 'block';
                
                // Convert 24-hour time to 12-hour format
                const time12 = convertTo12Hour(alarm.time);
                
                // Fill in the form fields
                alarmHourInput.value = time12.hour;
                alarmMinuteInput.value = time12.minute;
                amPmSelect.value = time12.ampm;
                alarmLabelInput.value = alarm.label || '';
                durationMinutesInput.value = alarm.durationMinutes || '';
                durationSecondsInput.value = alarm.durationSeconds || '';
                
                // Select the days
                selectedDays = [...(alarm.days || [])];
                weekdayButtons.forEach(btn => {
                    const day = parseInt(btn.getAttribute('data-day'));
                    if (selectedDays.includes(day)) {
                        btn.classList.add('selected');
                    } else {
                        btn.classList.remove('selected');
                    }
                });
            }
            
            // Initial date display
            updateDate();
            
            // Start the clock with setInterval for continuous operation
            clockInterval = setInterval(updateClock, 1000);
            
            // Initial call to show time immediately
            updateClock();
            
            // Check for upcoming alarms every minute
            upcomingCheckInterval = setInterval(checkUpcomingAlarms, 60000);
            
            // Function to check if an alarm should be active today
            function shouldAlarmBeActiveToday(alarm, now) {
                // If it's a one-time alarm (no days specified)
                if (!alarm.days || alarm.days.length === 0) {
                    // Check if the alarm time has already passed today
                    const [alarmHours, alarmMinutes] = alarm.time.split(':').map(Number);
                    const alarmTime = new Date(now);
                    alarmTime.setHours(alarmHours, alarmMinutes, 0, 0);
                    
                    // If the alarm time is in the future today, it's active
                    return alarmTime > now;
                }
                
                // For recurring alarms, check if today is one of the selected days
                const today = now.getDay();
                return alarm.days.includes(today);
            }
            
            // Function to check upcoming alarms
            function checkUpcomingAlarms() {
                const now = new Date();
                let upcoming = null;
                let soonestTime = Infinity;
                
                // Find the soonest upcoming alarm
                alarms.forEach(alarm => {
                    if (alarm.active) {
                        const [alarmHours, alarmMinutes] = alarm.time.split(':').map(Number);
                        
                        // Check for recurring alarms
                        if (alarm.days && alarm.days.length > 0) {
                            // For recurring alarms, find the next occurrence
                            let nextOccurrence = null;
                            let daysToAdd = 0;
                            const today = now.getDay();
                            
                            // Sort days to ensure correct next day finding
                            const sortedDays = [...alarm.days].sort((a, b) => a - b);
                            
                            // Find the next day from today
                            let foundNextDay = false;
                            for (const day of sortedDays) {
                                if (day > today || (day === today && (alarmHours > now.getHours() || 
                                    (alarmHours === now.getHours() && alarmMinutes > now.getMinutes())))) {
                                    daysToAdd = day - today;
                                    foundNextDay = true;
                                    break;
                                }
                            }
                            
                            // If no next day found in the current week, take the first day from next week
                            if (!foundNextDay && sortedDays.length > 0) {
                                daysToAdd = 7 - today + sortedDays[0];
                            }
                            
                            // Create the next occurrence date
                            if (daysToAdd >= 0) {
                                nextOccurrence = new Date(now);
                                nextOccurrence.setDate(nextOccurrence.getDate() + daysToAdd);
                                nextOccurrence.setHours(alarmHours, alarmMinutes, 0, 0);
                                
                                // If it's today but already passed, move to next week
                                if (daysToAdd === 0 && nextOccurrence <= now) {
                                    nextOccurrence.setDate(nextOccurrence.getDate() + 7);
                                }
                            }
                            
                            if (nextOccurrence) {
                                const timeDiff = nextOccurrence - now;
                                
                                // If this is the soonest upcoming alarm, save it
                                if (timeDiff < soonestTime) {
                                    soonestTime = timeDiff;
                                    upcoming = {
                                        time: formatTime12Hour(alarm.time),
                                        timeDiff: timeDiff,
                                        days: alarm.days,
                                        nextDate: nextOccurrence,
                                        label: alarm.label
                                    };
                                }
                            }
                        } else {
                            // For non-recurring alarms, calculate the time to next occurrence
                            const alarmDate = new Date(now);
                            alarmDate.setHours(alarmHours, alarmMinutes, 0, 0);
                            
                            // If alarm time is earlier than current time, it must be for tomorrow
                            if (alarmDate < now) {
                                alarmDate.setDate(alarmDate.getDate() + 1);
                            }
                            
                            const timeDiff = alarmDate - now;
                            
                            // If this is the soonest upcoming alarm, save it
                            if (timeDiff < soonestTime) {
                                soonestTime = timeDiff;
                                upcoming = {
                                    time: formatTime12Hour(alarm.time),
                                    timeDiff: timeDiff,
                                    nextDate: alarmDate,
                                    label: alarm.label
                                };
                            }
                        }
                    }
                });
                
                // Display the upcoming alarm if any
                if (upcoming) {
                    const hours = Math.floor(upcoming.timeDiff / (1000 * 60 * 60));
                    const minutes = Math.floor((upcoming.timeDiff % (1000 * 60 * 60)) / (1000 * 60));
                    
                    // Format display with day name for recurring alarms
                    let upcomingText = '';
                    
                    if (upcoming.days && upcoming.days.length > 0) {
                        const nextDay = daysOfWeek[upcoming.nextDate.getDay()];
                        upcomingText = upcoming.label ? 
                            `${upcoming.label}: ${upcoming.time} (${nextDay})` :
                            `Next alarm: ${upcoming.time} (${nextDay})`;
                    } else {
                        upcomingText = upcoming.label ? 
                            `${upcoming.label}: ${upcoming.time}` :
                            `Next alarm: ${upcoming.time}`;
                    }
                    
                    // Add time until alarm
                    if (hours > 0) {
                        upcomingText += ` (in ${hours}h ${minutes}m)`;
                    } else {
                        upcomingText += ` (in ${minutes}m)`;
                    }
                    
                    upcomingAlarmsElement.textContent = upcomingText;
                } else {
                    upcomingAlarmsElement.textContent = 'No upcoming alarms';
                }
            }
            
            // Function to format 24-hour time as 12-hour time for display
            function formatTime12Hour(time24) {
                const time12 = convertTo12Hour(time24);
                return `${time12.hour}:${time12.minute} ${time12.ampm}`;
            }
            
            // Check immediately on load
            checkUpcomingAlarms();
            
            // Function to check and trigger alarms
            function checkAlarms(now) {
                const hours = now.getHours();
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();
                const currentTime = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
                const today = now.getDay();
                
                alarms.forEach((alarm, index) => {
                    if (alarm.active && alarm.time === currentTime && seconds === 0) {
                        // Check if this is a recurring alarm and if today is one of the scheduled days
                        const isRecurring = alarm.days && alarm.days.length > 0;
                        
                        // For recurring alarms, only trigger if today is a selected day
                        if (isRecurring && alarm.days.includes(today)) {
                            triggerAlarm(alarm);
                        } 
                        // For one-time alarms, trigger and then deactivate
                        else if (!isRecurring) {
                            triggerAlarm(alarm);
                            
                            // Mark one-time alarms as inactive after triggering
                            alarms[index].active = false;
                            saveAlarms();
                            renderAlarms();
                        }
                    }
                });
            }
            
            // Function to trigger alarm
            function triggerAlarm(alarm) {
                // Play beep sound twice
                createBeepSound();
                setTimeout(createBeepSound, 600); // Play again after 600ms
                
                // Start blinking animation
                startBlinkingAnimation();
                
                // Show timer animation
                showTimer(alarm.durationMinutes, alarm.durationSeconds);
                
                // Show notification
                if ("Notification" in window && Notification.permission === "granted") {
                    let notificationText = `Alarm time: ${formatTime12Hour(alarm.time)}`;
                    if (alarm.label) {
                        notificationText = `${alarm.label} - ${formatTime12Hour(alarm.time)}`;
                    }
                    
                    new Notification("Alarm!", {
                        body: notificationText,
                        icon: "https://cdn.iconscout.com/icon/free/png-256/free-alarm-1551447-1311723.png"
                    });
                } else if ("Notification" in window && Notification.permission !== "denied") {
                    Notification.requestPermission();
                }
            }
            
            // Function to start blinking animation
            function startBlinkingAnimation() {
                clockElement.classList.add('blinking-clock');
                
                // Clear any existing timeout
                if (blinkingTimeout) {
                    clearTimeout(blinkingTimeout);
                }
                
                // Stop blinking after 10 seconds
                blinkingTimeout = setTimeout(() => {
                    clockElement.classList.remove('blinking-clock');
                }, 10000);
            }
            
            // Function to show timer with color gradient
            function showTimer(minutes, seconds) {
                // Clear existing interval if any
                if (timerInterval) {
                    clearInterval(timerInterval);
                }
                
                // Convert duration to seconds
                const durationMinutes = parseInt(minutes) || 0;
                const durationSeconds = parseInt(seconds) || 0;
                const totalSeconds = durationMinutes * 60 + durationSeconds;
                
                // Default to 10 seconds if no duration specified
                const totalDuration = totalSeconds > 0 ? totalSeconds : 10;
                let remainingSeconds = totalDuration;
                
                // Reset timer fill
                timerFill.style.height = '0%';
                timerFill.style.background = '#4cd137'; // Start with green
                
                // Show timer container
                timerContainer.style.display = 'flex';
                
                // Update time display
                updateTimeRemaining(remainingSeconds);
                
                // Calculate update interval (should fill completely over the duration)
                const updateInterval = 100; // milliseconds
                const totalUpdates = (totalDuration * 1000) / updateInterval;
                const fillIncrement = 100 / totalUpdates; // percentage per update
                
                let currentFillPercentage = 0;
                
                // Start timer animation
                timerInterval = setInterval(() => {
                    currentFillPercentage += fillIncrement;
                    
                    // Ensure we don't exceed 100%
                    const percentage = Math.min(currentFillPercentage, 100);
                    
                    // Update fill level
                    timerFill.style.height = `${percentage}%`;
                    
                    // Update fill color based on percentage
                    updateTimerColor(percentage);
                    
                    // Update time remaining
                    remainingSeconds = Math.max(0, totalDuration - Math.floor((totalDuration * percentage) / 100));
                    updateTimeRemaining(remainingSeconds);
                    
                    // Check if animation is complete
                    if (percentage >= 100) {
                        clearInterval(timerInterval);
                        
                        // Automatically close timer after 2 seconds
                        setTimeout(() => {
                            timerContainer.style.display = 'none';
                        }, 2000);
                    }
                }, updateInterval);
            }
            
            // Function to update timer color based on progress
            function updateTimerColor(percentage) {
                let color;
                
                if (percentage < 25) {
                    // Green (0-25%)
                    color = '#4cd137';
                } else if (percentage < 50) {
                    // Green to Yellow gradient (25-50%)
                    color = `linear-gradient(to top, #fbc531, #4cd137)`;
                } else if (percentage < 75) {
                    // Yellow to Orange gradient (50-75%)
                    color = `linear-gradient(to top, #e84118, #fbc531)`;
                } else {
                    // Orange to Red gradient (75-100%)
                    color = `linear-gradient(to top, #c23616, #e84118)`;
                }
                
                timerFill.style.background = color;
            }
            
            // Function to stop timer
            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                }
                timerContainer.style.display = 'none';
            }
            
            // Update time remaining display in mm:ss format
            function updateTimeRemaining(seconds) {
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = seconds % 60;
                timeRemainingElement.textContent = `${minutes.toString().padStart(2, '0')}:${remainingSeconds.toString().padStart(2, '0')}`;
            }
            
            // Function to add or update an alarm
            setAlarmButton.addEventListener('click', function() {
                // Validate inputs
                if (!validateTimeInputs()) {
                    return;
                }
                
                const hour = parseInt(alarmHourInput.value);
                const minute = parseInt(alarmMinuteInput.value);
                const ampm = amPmSelect.value;
                
                // Convert to 24-hour format for internal storage
                const alarmTime = convertTo24Hour(hour, minute, ampm);
                const alarmLabel = alarmLabelInput.value;
                const durationMinutes = durationMinutesInput.value || '0';
                const durationSeconds = durationSecondsInput.value || '0';
                
                if (editingAlarmId) {
                    // Update existing alarm
                    const alarmIndex = alarms.findIndex(alarm => alarm.id === editingAlarmId);
                    
                    if (alarmIndex !== -1) {
                        alarms[alarmIndex] = {
                            ...alarms[alarmIndex],
                            time: alarmTime,
                            label: alarmLabel,
                            durationMinutes: durationMinutes,
                            durationSeconds: durationSeconds,
                            days: [...selectedDays]
                        };
                        
                        console.log('Alarm updated:', alarms[alarmIndex]);
                    }
                } else {
                    // Add new alarm
                    const newAlarm = {
                        id: Date.now().toString(),
                        time: alarmTime,
                        label: alarmLabel,
                        durationMinutes: durationMinutes,
                        durationSeconds: durationSeconds,
                        active: true,
                        days: [...selectedDays]
                    };
                    
                    alarms.push(newAlarm);
                    console.log('New alarm added:', newAlarm);
                }
                
                // Save and update UI
                saveAlarms();
                renderAlarms();
                checkUpcomingAlarms();
                
                // Reset form
                resetAlarmForm();
                
                // Close settings panel
                alarmSettingsPanel.style.display = 'none';
                toggleSettingsButton.style.display = 'flex';
            });
            
            // Function to save alarms
            function saveAlarms() {
                try {
                    localStorage.setItem('alarms', JSON.stringify(alarms));
                    console.log("Alarms saved successfully");
                } catch (e) {
                    console.error("Error saving alarms:", e);
                }
            }
            
            // Function to format duration for display
            function formatDuration(minutes, seconds) {
                let result = '';
                
                if (parseInt(minutes) > 0) {
                    result += `${minutes}m `;
                }
                
                if (parseInt(seconds) > 0) {
                    result += `${seconds}s`;
                }
                
                return result.trim() || '0s';
            }
            
            // Function to format weekdays for display
            function formatWeekdays(days) {
                if (!days || days.length === 0) {
                    return 'One-time';
                }
                
                // Return "Daily" if all 7 days are selected
                if (days.length === 7) {
                    return 'Daily';
                }
                
                // Return "Weekdays" if Monday-Friday are selected
                if (days.length === 5 && 
                    days.includes(1) && days.includes(2) && 
                    days.includes(3) && days.includes(4) && 
                    days.includes(5) && !days.includes(0) && 
                    !days.includes(6)) {
                    return 'Weekdays';
                }
                
                // Return "Weekends" if Saturday and Sunday are selected
                if (days.length === 2 && days.includes(0) && days.includes(6)) {
                    return 'Weekends';
                }
                
                // Otherwise, list the days
                return days.map(day => shortDaysOfWeek[day]).join(' ');
            }
            
            // Function to render alarms list
            function renderAlarms() {
                alarmsContainer.innerHTML = '';
                
                if (alarms.length === 0) {
                    alarmsContainer.innerHTML = '<p style="text-align: center; padding: 15px;">No alarms set.</p>';
                    return;
                }
                
                // Sort alarms by time
                alarms.sort((a, b) => {
                    return a.time.localeCompare(b.time);
                });
                
                // Get current date to check if one-time alarms have passed
                const now = new Date();
                
                // Filter out passed one-time alarms
                alarms = alarms.filter(alarm => {
                    // Keep recurring alarms
                    if (alarm.days && alarm.days.length > 0) {
                        return true;
                    }
                    
                    // Keep inactive alarms
                    if (!alarm.active) {
                        return true;
                    }
                    
                    // Check if one-time alarm has passed
                    const [alarmHours, alarmMinutes] = alarm.time.split(':').map(Number);
                    const alarmDate = new Date(now);
                    alarmDate.setHours(alarmHours, alarmMinutes, 0, 0);
                    
                    // If alarm is in the past, filter it out
                    if (alarmDate < now) {
                        console.log('Removing passed alarm:', alarm);
                        return false;
                    }
                    
                    return true;
                });
                
                // Save filtered alarms
                saveAlarms();
                
                alarms.forEach(alarm => {
                    const alarmItem = document.createElement('div');
                    alarmItem.classList.add('alarm-item');
                    
                    const alarmInfo = document.createElement('div');
                    
                    const alarmTime = document.createElement('span');
                    alarmTime.classList.add('alarm-time');
                    
                    // Format the display to show minutes and seconds
                    const durationText = formatDuration(alarm.durationMinutes, alarm.durationSeconds);
                    // Display time in 12-hour format
                    alarmTime.textContent = `${formatTime12Hour(alarm.time)} (${durationText})`;
                    
                    alarmInfo.appendChild(alarmTime);
                    
                    // Add alarm label if it exists
                    if (alarm.label) {
                        const alarmLabelElem = document.createElement('div');
                        alarmLabelElem.classList.add('alarm-label');
                        alarmLabelElem.textContent = alarm.label;
                        alarmInfo.appendChild(alarmLabelElem);
                    }
                    
                    // Display if this is a one-time or recurring alarm
                    const weekdaysText = document.createElement('div');
                    weekdaysText.textContent = formatWeekdays(alarm.days);
                    weekdaysText.style.fontSize = '0.8rem';
                    weekdaysText.style.marginTop = '3px';
                    alarmInfo.appendChild(weekdaysText);
                    
                    const alarmActions = document.createElement('div');
                    alarmActions.classList.add('alarm-actions');
                    
                    // Edit button
                    const editButton = document.createElement('button');
                    editButton.classList.add('edit-btn');
                    editButton.textContent = 'Edit';
                    editButton.addEventListener('click', () => {
                        // Open settings panel
                        alarmSettingsPanel.style.display = 'block';
                        toggleSettingsButton.style.display = 'none';
                        alarmSettingsPanel.classList.add('settings-visible');
                        
                        // Populate form with alarm data
                        populateFormForEditing(alarm);
                    });
                    
                    const toggleButton = document.createElement('button');
                    toggleButton.classList.add('toggle-btn');
                    if (!alarm.active) {
                        toggleButton.classList.add('paused');
                    }
                    toggleButton.textContent = alarm.active ? 'Pause' : 'Active';
                    toggleButton.addEventListener('click', () => toggleAlarm(alarm.id));
                    
                    const deleteButton = document.createElement('button');
                    deleteButton.classList.add('delete-btn');
                    deleteButton.textContent = 'Delete';
                    deleteButton.addEventListener('click', () => deleteAlarm(alarm.id));
                    
                    alarmActions.appendChild(editButton);
                    alarmActions.appendChild(toggleButton);
                    alarmActions.appendChild(deleteButton);
                    
                    alarmItem.appendChild(alarmInfo);
                    alarmItem.appendChild(alarmActions);
                    
                    alarmsContainer.appendChild(alarmItem);
                });
            }
            
            // Function to toggle alarm active status
            function toggleAlarm(id) {
                const alarmIndex = alarms.findIndex(alarm => alarm.id === id);
                
                if (alarmIndex !== -1) {
                    alarms[alarmIndex].active = !alarms[alarmIndex].active;
                    saveAlarms();
                    renderAlarms();
                    checkUpcomingAlarms();
                }
            }
            
            // Function to delete alarm
            function deleteAlarm(id) {
                alarms = alarms.filter(alarm => alarm.id !== id);
                saveAlarms();
                renderAlarms();
                checkUpcomingAlarms();
            }
            
            // Request notification permission on page load
            if ("Notification" in window) {
                Notification.requestPermission();
            }
            
            // Close timer button
            closeTimerButton.addEventListener('click', function() {
                stopTimer();
            });
            
            // Load saved alarms and render them
            renderAlarms();
            checkUpcomingAlarms();
            
            // Clean up on page unload
            window.addEventListener('beforeunload', function() {
                // Clear any running intervals to prevent memory leaks
                if (clockInterval) clearInterval(clockInterval);
                if (timerInterval) clearInterval(timerInterval);
                if (upcomingCheckInterval) clearInterval(upcomingCheckInterval);
                if (blinkingTimeout) clearTimeout(blinkingTimeout);
                
                // Close audio context if it exists
                if (audioContext && audioContext.state !== 'closed') {
                    audioContext.close().catch(e => console.error('Error closing AudioContext:', e));
                }
            });
        });
    </script>
