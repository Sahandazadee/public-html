<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>واژه‌نامه · مستر کلاس ESP32</title>
<meta name="description" content="واژه‌نامه فارسی اصطلاحات ESP32 و الکترونیک با زبان ساده">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='3' y='3' width='34' height='34' rx='9' fill='%232f7af0'/%3E%3Ccircle cx='20' cy='20' r='7' fill='%233cc9a0'/%3E%3C/svg%3E">
<script defer src="assets/course.js"></script>
<script defer src="assets/glossary.js"></script>
<script defer src="assets/app.js"></script>
</head>
<body>
<article class="page" data-page="glossary">
<span class="eyebrow">مرجع</span>
<h1>واژه‌نامه ساده ESP32 و الکترونیک</h1>
<p class="lede">هر اصطلاحی که در درس‌ها دیدی و مطمئن نبودی، اینجا با زبان ساده و یک مثال توضیح داده شده. همین توضیح‌ها وقتی روی کلمه‌های نقطه‌چین درس‌ها مکث می‌کنی ظاهر می‌شوند.</p>
<input class="gl-search no-print" type="search" placeholder="جستجو: مثلا PWM یا مقاومت" aria-label="جستجو در واژه‌نامه">
<div id="gl" class="no-term"></div>
</article>
<script>
document.addEventListener("esp32mc-ready", function () {
  var G = window.GLOSSARY, esc = window.ESP32MC.esc, box = document.getElementById("gl");
  var keys = Object.keys(G).sort(function (a, b) { return a.localeCompare(b, "fa"); });
  box.innerHTML = keys.map(function (k) {
    return '<div class="gl-item" data-s="' + esc((k + " " + G[k][0] + " " + G[k][1]).toLowerCase()) + '"><h3>' + esc(k) + ' <small>' + esc(G[k][0]) + '</small></h3><p>' + esc(G[k][1]) + '</p></div>';
  }).join("");
  document.querySelector(".gl-search").addEventListener("input", function () {
    var q = this.value.trim().toLowerCase();
    box.querySelectorAll(".gl-item").forEach(function (d) { d.hidden = q && d.getAttribute("data-s").indexOf(q) < 0; });
  });
});
</script>
</body>
</html>
